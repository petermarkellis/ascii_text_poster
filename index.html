      for (let ly = 0; ly < e.h; ly++) {
        const gy = oy + ly;
        if (gy < 0 || gy >= rows) continue;
        for (let lx = 0; lx < e.w; lx++) {
          if (!mask(lx, ly, e.w, e.h)) continue;
          const gx = ox + lx;
          if (gx < 0 || gx >= cols) continue;

          const row = e.buildUp ? e.h - 1 - ly : ly;
          const turn = (row + hash2(lx, ly, e.seed) * e.jitter) / span;
          if (build < turn) continue;

          const grain = fbm((lx + e.seed) * 0.3, (ly - e.age * 0.4) * 0.3, e.seed);
          if (grain <= decay) continue;

          const i = gy * cols + gx;
          const li = ly * e.w + lx;

          // A cell arrives faint and firms up over its first moments. The
          // rim step is held against it, so an edge cell never fully
          // resolves — whichever is fainter wins.
          const since = build - turn;
          const arriving = since < 0.05 ? 2 : since < 0.12 ? 1 : 0;
          const level = Math.max(arriving, e.fade[li]);

          if (coverOn[i]) {
            // Crossing another group. The ink is re-picked against the
            // blended ground rather than carried over, or a glyph chosen
            // for one colour would be left sitting on a different one.
            const bg = overprint(coverBg[i], e.bg);
            coverBg[i] = bg;
            coverFg[i] = (isDark(bg) ? C.light : C.dark) + INK_FADE[level];
          } else {
            coverOn[i] = 1;
            coverBg[i] = e.bg;
            coverFg[i] = e.inks[li] + INK_FADE[level];
          }
          coverChar[i] = e.seq ? seqChar(e, lx, ly) : e.chars[li];
        }
      }
    }

    function stampEntity(e) {
      const decay = clamp01((e.age / e.life - 0.45) / 0.55);
      if (e.shape) return stampShape(e, decay);

      const appear = clamp01(e.age / 1.4);
      const ox = Math.round(e.x), oy = Math.round(e.y);

      for (let ly = 0; ly < e.h; ly++) {
        const gy = oy + ly;
        if (gy < 0 || gy >= rows) continue;
        for (let lx = e.indent[ly]; lx < e.w; lx++) {
          const gx = ox + lx;
          if (gx < 0 || gx >= cols) continue;
          if (!cellAlive(e, lx, ly, appear, decay)) continue;

          const i = gy * cols + gx;
          const li = ly * e.w + lx;

          if (coverOn[i]) {
            const bg = overprint(coverBg[i], e.bg);
            coverBg[i] = bg;
            coverFg[i] = isDark(bg) ? C.light : C.dark;
          } else {
            coverOn[i] = 1;
            coverBg[i] = e.bg;
            coverFg[i] = e.inks[li];
          }
          coverChar[i] = e.seq ? seqChar(e, lx, ly) : e.chars[li];
        }
      }
    }

    function updateEntity(e, dt) {
      e.age += dt;
      e.x += e.vx * dt;
      e.y += e.vy * dt;

      e.frame++;
      if (e.seq) {
        if (e.frame % e.every === 0) e.step++;
      } else if (e.frame % 2 === 0) {
        // Re-roll a slice of the buffer so the group shimmers as it moves.
        const n = Math.max(1, Math.round(e.chars.length * 0.06));
        for (let k = 0; k < n; k++) {
          e.chars[irand(0, e.chars.length - 1)] = pick(e.set);
        }
      }

      const gone = e.age > e.life;
      const driftedOff = e.x + e.w < -2 || e.x > cols + 2 || e.y + e.h < -2 || e.y > rows + 2;
      return !(gone || driftedOff);
    }

    // Only ever tops up. Lowering the slider lets the surplus die off on
    // its own schedule instead of culling groups mid-life, which would
    // pop them off screen — they drain out through the usual decay.
    function topUpEntities() {
      while (entities.length < targetEntities()) {
        const r = rng();
        entities.push(spawnEntity(r < 0.3 ? 'bar' : r < 0.55 ? 'shape' : 'block'));
      }
    }

    /* ---------------------------------------------------------------
       Message layout. `revealed` skips the animation and drops the word
       in already settled — used when the grid is rebuilt underneath an
       existing message, so it survives a resize without replaying.

       Text that outruns the grid wraps onto further lines, and `//` puts
       a break wherever you want one. Wrapping is done at layout time
       rather than stored, so the same text re-flows when the grid is
       reshaped: a message written wide reads as several lines when the
       cells grow, without being retyped.
    --------------------------------------------------------------- */

    // Greedy word wrap. A word with nowhere to fit is broken rather than
    // allowed to overhang, since a large letter off the edge is just gone.
    function wrapWords(text, room) {
      const out = [];
      let line = '';
      for (const word of text.split(/\s+/)) {
        if (!word) continue;
        if (!line) line = word;
        else if (line.length + 1 + word.length <= room) line += ' ' + word;
        else { out.push(line); line = word; }

        while (line.length > room) {
          out.push(line.slice(0, room));
          line = line.slice(room);
        }
      }
      if (line) out.push(line);
      return out;
    }

    function layoutMessage(text, revealed) {
      const large = msgFormat.value === 'large';
      // A large letter eats six columns, so far fewer of them fit.
      const room = large
        ? Math.max(1, Math.floor((cols - 2 + GLYPH_GAP) / GLYPH_ADV))
        : Math.max(1, cols - 2);

      const raw = (text || '').toUpperCase();
      // Explicit breaks first, then each segment wrapped to what is left.
      const wanted = [];
      for (const seg of raw.split('//')) {
        for (const line of wrapWords(seg, room)) wanted.push(line);
      }

      const glyphH = large ? GLYPH_H : 1;
      const adv = glyphH + (large ? MSG_LINE_GAP : 0);
      // Lines past what the grid is tall are dropped, not scrolled.
      const maxLines = Math.max(1, Math.floor((rows - glyphH) / adv) + 1);
      const text_lines = wanted.slice(0, maxLines);
      if (!text_lines.length) { message = null; return; }

      const total = text_lines.reduce((n, s) => n + s.length, 0);
      // The roll crosses the whole message as one gesture, so a long one
      // tightens its stagger instead of taking a minute to arrive. Short
      // messages are under the cap and keep their original timing exactly.
      const stagger = Math.min(MSG_STAGGER, MSG_ROLL / Math.max(1, total - 1));

      const blockH = (text_lines.length - 1) * adv + glyphH;
      const top = Math.max(0, (rows - blockH) >> 1);

      let idx = 0;
      const lines = text_lines.map((s, li) => {
        const span = large ? s.length * GLYPH_ADV - GLYPH_GAP : s.length;
        return {
          // Each line is centred on its own width, so ragged wrapping
          // reads as centred text rather than a left-aligned block.
          x0: Math.max(0, (cols - span) >> 1),
          y: top + li * adv,
          span,
          letters: [...s].map((ch) => {
            const k = idx++;
            return {
              target: ch,
              idx: k,             // position in the whole message, not the line
              startAt: k * stagger,
              jit: hash2(k, 5, 9),  // staggers its exit, so the word frays away
              rows: FONT[ch] || FONT[' ']
            };
          })
        };
      });

      // Large letters need the extra beats for the per-cell stagger and
      // for their spare cells to fall away afterwards.
      const endAt = (total - 1) * stagger + MSG_SCRAMBLE
        + (large ? MSG_CELL_SPREAD + MSG_CLEAR : 0);

      // Row -> line lookup. The composite runs this per cell, so it wants
      // one array read to reject the rows the message isn't on.
      const lineOf = new Int16Array(rows).fill(-1);
      const rowIn = new Int16Array(rows);
      lines.forEach((L, li) => {
        for (let r = 0; r < glyphH; r++) {
          const gy = L.y + r;
          if (gy >= 0 && gy < rows) { lineOf[gy] = li; rowIn[gy] = r; }
        }
      });

      message = {
        large,
        text: raw,        // kept unwrapped, so a reshape re-flows it
        lines,
        lineOf,
        rowIn,
        endAt,
        t: revealed ? endAt : 0,
        step: 0
      };
    }

    /* --- Compose and flush --------------------------------------- */

    function composite() {
      coverOn.fill(0);
      for (const e of entities) stampEntity(e);

      // A stale snapshot (the grid was reshaped mid-sweep) can't be indexed
      // against the new arrays, so drop it rather than mismatch.
      if (wipe && wipe.bg.length !== base.length) wipe = null;
      const panelDiag = Math.max(1, panelCols + rows - 2);
      const chroma = chromaAmount();

      for (let i = 0; i < base.length; i++) {
        const b = base[i];
        const on = coverOn[i];
        let bg = on ? coverBg[i] : (b.bg || C.paper);
        let fill = on ? null : b.fill;
        let fg = on ? coverFg[i] : (b.fg || C.dark);
        let char = suppressesChar(fill) ? '' : (on ? coverChar[i] : b.char);
        let ui = 0;   // set by the message and panel layers below

        // Cells the ground has receded from. Entities are the live layer
        // and keep drifting over the bare canvas; a hand-painted cell is
        // yours and stays, whatever the ground does underneath it.
        if (!on && groundLevel < 1 && groundNoise[i] > groundLevel && !painted.has(i)) {
          bg = C.paper;
          fill = null;
          fg = C.dark;
          char = '';
        }

        if (wipe) {
          const x = i % cols, y = (i / cols) | 0;
          // Whichever arrival this sweep drew; resolved once at its start
          // so the front keeps its shape even if the control moves.
          const arrive = wipe.at(x, y) * WIPE_SWEEP;
          const p = (wipe.t - arrive) / WIPE_HOLD;

          if (p < 0) {
            // Not reached yet: hold the outgoing image exactly as it was.
            bg = wipe.bg[i]; fill = wipe.fill[i];
            fg = wipe.fg[i]; char = wipe.char[i];
          } else if (p < 1) {
            // In the band. The grain term ragged-edges the trailing side,
            // and the floor guarantees every cell shows the sweep at all
            // rather than low-grain cells snapping straight through.
            const grain = 0.35 + fbm(x * 0.22, y * 0.22, 7) * 0.65;
            if (grain > p) {
              bg = C.dark;
              fill = null;
              fg = C.light + INK_FADE[p > 0.66 ? 2 : p > 0.33 ? 1 : 0];
              char = WIPE_SEQ[(wipe.step + x + y) % WIPE_SEQ.length];
            }
          }
          // Past the hold: fall through to the live values already set.
        }

        // Applied here so it colours the artwork and the regenerate sweep,
        // but not the message or the panel below — those are UI surfaces
        // and shouldn't drift with position.
        if (chroma) {
          const x = i % cols;
          bg = chromaShift(bg, x, chroma);
          fg = chromaShift(fg, x, chroma);
        }

        // Typed message. The row lookup rejects every cell the message
        // isn't on — nearly all of them — in a single array read.
        if (message) {
          const li = message.lineOf[(i / cols) | 0];
          if (li >= 0) {
            const LN = message.lines[li];
            const ly = message.rowIn[(i / cols) | 0];
            const dx = (i % cols) - LN.x0;
            // Large letters span GLYPH_ADV columns; inline ones sit in a
            // single cell, which is the same arithmetic with a stride of 1.
            const k = message.large ? (dx / GLYPH_ADV) | 0 : dx;
            const lx = message.large ? dx - k * GLYPH_ADV : 0;
            // lx === GLYPH_W is the gap column between large letters.
            if (dx >= 0 && k < LN.letters.length && lx < GLYPH_W) {
              const L = LN.letters[k];
              const life = decaySeconds();
              const gone = life > 0 &&
                message.t >= message.endAt + life + L.jit * MSG_FADE_SPREAD;
              // Column within the whole message, so two lines that happen
              // to sit at the same offset don't churn in lockstep.
              const gx = L.idx * GLYPH_ADV + lx;

              if (message.large) {
                // Every cell in the block gets its own start, so the letter
                // assembles cell by cell rather than the whole box lighting.
                const age = message.t - L.startAt
                  - hash2(lx, ly, 23) * MSG_CELL_SPREAD;

                if (age >= 0 && !gone) {
                  if (age < MSG_SCRAMBLE) {
                    // Whole block churns before anything resolves.
                    bg = C.msgBg; fill = null; fg = C.msgInk; ui = 2;
                    char = SCRAMBLE[Math.floor(
                      hash2(gx, message.step + ly, 3) * SCRAMBLE.length)];
                  } else if (L.rows[ly].charCodeAt(lx) === 35) {
                    // Stroke cell: a solid block of ink, no glyph.
                    bg = C.msgInk; fill = null; fg = C.msgBg; char = ''; ui = 2;
                  } else if ((age - MSG_SCRAMBLE) / MSG_CLEAR < hash2(gx, ly, 17)) {
                    // Spare cell still falling away — jittered so the letter
                    // emerges out of the block rather than being stamped.
                    bg = C.msgBg; fill = null; fg = C.msgInk; char = ''; ui = 2;
                  }
                }
              } else {
                const age = message.t - L.startAt;
                if (age >= 0 && !gone) {
                  bg = C.msgBg;
                  fill = null;
                  fg = C.msgInk;
                  ui = 2;
                  char = age < MSG_SCRAMBLE
                    // Hashed on the frame step so the churn is random-looking
                    // but stable within a frame — otherwise it would tear.
                    ? SCRAMBLE[Math.floor(hash2(gx, message.step, 3) * SCRAMBLE.length)]
                    : (L.target === ' ' ? '' : L.target);
                }
              }
            }
          }
        }

        // The panel block is laid last so it covers everything else,
        // including a sweep in progress.
        if (panelCols > 0 && (panelOpen || panelAnim)) {
          const x = i % cols;
          if (x < panelCols) {
            const y = (i / cols) | 0;
            const arrive = ((x + y) / panelDiag) * PANEL_SWEEP;

            // `since` is how long this cell has been laid when building,
            // or how long until it is lifted when clearing — either way
            // small means "at the front", which is where the sequence runs.
            let covered, since;
            if (!panelAnim) {
              covered = panelOpen;
              since = Infinity;
            } else if (panelAnim.dir > 0) {
              covered = panelAnim.t >= arrive;
              since = panelAnim.t - arrive;
            } else {
              covered = panelAnim.t < arrive;
              since = arrive - panelAnim.t;
            }

            if (covered) {
              bg = C.panelBg;
              fill = null;
              fg = C.panelFg;
              ui = 1;
              char = since < PANEL_TRAIL
                ? WIPE_SEQ[(panelAnim.step + x + y) % WIPE_SEQ.length]
                : '';
            }
          }
        }

        postBg[i] = bg;
        postFill[i] = fill;
        postFg[i] = fg;
        postChar[i] = char;
        postUi[i] = ui;
      }

      /* Second pass: the channel split samples sideways, so it can only
         run once every cell's colour is resolved. The panel is always
         exempt — a fringed control panel reads as a rendering fault, not
         style — while the message is exempt only if you ask for it, since
         fringed text is a legitimate thing to want. */
      const d = splitCells();

      if (d) {
        const keepMsg = msgSplitInput.value !== 'apply';
        for (let i = 0; i < postUi.length; i++) {
          const u = postUi[i];
          splitGuard[i] = (u === 1 || (u === 2 && keepMsg)) ? 1 : 0;
        }
      }

      for (let i = 0; i < base.length; i++) {
        let bg = postBg[i], fg = postFg[i];
        if (d && !splitGuard[i]) {
          bg = splitRGB(postBg, i, d, splitGuard);
          fg = splitRGB(postFg, i, d, splitGuard);
        }
        const fill = postFill[i], char = postChar[i];

        if (bg !== viewBg[i]) { els[i].style.backgroundColor = bg; viewBg[i] = bg; }
        if (fill !== viewFill[i]) {
          if (fill) {
            els[i].style.backgroundImage = fill.image;
            els[i].style.backgroundSize = `${fill.size}px ${fill.size}px`;
            const x = i % cols, y = (i / cols) | 0;
            const ox = (x * cellW).toFixed(2), oy = (y * cellH).toFixed(2);
            // The per-cell offset is what makes neighbouring cells tile as
            // one continuous field. Holding it as a calc against a shared
            // variable lets the whole field scroll from a single write on
            // the container, instead of one per filled cell per frame.
            els[i].style.backgroundPosition = fill.fixed
              ? `-${ox}px -${oy}px`
              : `calc(var(--driftX) - ${ox}px) calc(var(--driftY) - ${oy}px)`;
          } else {
            els[i].style.backgroundImage = 'none';
          }
          viewFill[i] = fill;
        }
        if (fg !== viewFg[i]) { els[i].style.color = fg; viewFg[i] = fg; }
        if (char !== viewChar[i]) { setContent(i, char); viewChar[i] = char; }
      }
    }

    // A sequence frame is either typed or drawn. When a cell is already
    // holding the arrow, spin it by rewriting one attribute — reparsing
    // the markup on every step would be the expensive way to rotate.
    function setContent(i, token) {
      const angle = ARROW_ANGLE.get(token);
      if (angle === undefined) {
        els[i].textContent = token; // also clears any svg that was there
        viewSvg[i] = false;
      } else if (viewSvg[i] && els[i].firstElementChild) {
        els[i].firstElementChild.firstElementChild
          .setAttribute('transform', `rotate(${angle})`);
      } else {
        els[i].innerHTML = ARROW_SVG.get(token);
        viewSvg[i] = true;
      }
    }

    // What the current cell elements were built for, so a rebuild that
    // wouldn't change them can be skipped.
    let domCols = 0, domRows = 0, domFont = '';

    function buildDom() {
      const fontSize = Math.round(Math.min(cellW, cellH) * 0.55) + 'px';

      /* Regenerate and a palette change go through generate(), but neither
         alters the grid's shape — only what gets drawn into it. Tearing
         down and recreating thousands of elements to lay out the identical
         thing is the one plainly wasted cost in a rebuild, so keep them.
         The composite that follows repaints every cell regardless, because
         generate() has just blanked the view arrays. */
      if (domCols === cols && domRows === rows && domFont === fontSize &&
          els.length === cols * rows) {
        return;
      }
      domCols = cols; domRows = rows; domFont = fontSize;

      const frag = document.createDocumentFragment();
      els = new Array(cols * rows);

      for (let i = 0; i < cols * rows; i++) {
        const el = document.createElement('div');
        el.className = 'cell';
        el.style.fontSize = fontSize;
        els[i] = el;
        frag.appendChild(el);
      }

      grid.innerHTML = '';
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      grid.appendChild(frag);
    }

    function generate() {
      reseed();   // same seed, same poster

      const target = +cellSizeInput.value;
      cols = Math.max(8, Math.round(window.innerWidth / target));
      rows = Math.max(6, Math.round(window.innerHeight / target));
      cellW = window.innerWidth / cols;
      cellH = window.innerHeight / rows;

      // Snap the panel to whole columns and match the DOM to them exactly,
      // so the controls line up with the cell block that backs them.
      // One column past what the width alone asks for, so the controls
      // have a margin of block to sit on rather than meeting the edge.
      panelCols = Math.max(1, Math.min(cols - 2, Math.round(PANEL_PX / cellW) + 1));
      syncPanelGeometry();

      // Scaled off the cell, not fixed: 6px is a halo on a 16px cell and
      // barely visible on a 56px one.
      document.documentElement.style.setProperty(
        '--glow', Math.max(3, Math.round(Math.min(cellW, cellH) * 0.22)) + 'px');

      const n = cols * rows;
      base = Array.from({ length: n }, blank);
      entities = [];
      painted.clear();      // indices refer to the old grid
      stroke = [];          // likewise
      renew = null;         // its region belongs to the old layout
      renewWait = RENEW_GAP * 0.5;
      // Derived from the seed, so upkeep is reproducible too, but kept
      // clear of the stream that lays out the poster.
      renewRng = (seed ^ 0x9e3779b9) | 0;
      chromaCache.clear();  // keys are column indices, and cols just changed

      viewBg = new Array(n).fill(undefined);
      viewFill = new Array(n).fill(undefined);
      viewChar = new Array(n).fill(undefined);
      viewFg = new Array(n).fill(undefined);
      viewSvg = new Array(n).fill(false);
      coverBg = new Array(n);
      coverChar = new Array(n);
      coverFg = new Array(n);
      coverOn = new Uint8Array(n);
      postBg = new Array(n);
      postFill = new Array(n);
      postFg = new Array(n);
      postChar = new Array(n);
      postUi = new Uint8Array(n);
      splitGuard = new Uint8Array(n);

      // Depends only on position, so it is worth holding rather than
      // recomputing 1500 fbm samples on every frame the ground is short.
      groundNoise = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        groundNoise[i] = fbm((i % cols) * 0.22, ((i / cols) | 0) * 0.22, 5);
      }

      // The picture is re-screened at the new grid rather than scaled,
      // so the halftone stays one dot per cell at every size.
      samplePhoto();

      buildFields();
      // A photo *is* the composition; bars would only sit on top of it.
      if (!photo) buildBars();
      buildDom();

      // Stagger ages so the first frame isn't a synchronised bloom.
      topUpEntities();
      for (const e of entities) e.age = rand(0, e.life * 0.6);

      // Re-centre an existing message on the new grid, already revealed.
      if (message) layoutMessage(message.text, true);

      composite();
    }

    // Freeze what is on screen, then build the replacement behind it. The
    // slice has to happen before generate(), which swaps the view arrays
    // for fresh ones — and generate's own composite() already draws
    // through the wipe, so the new image never flashes up first.
    function startRegenerate() {
      // Random draws a fresh front each time; anything else pins it.
      // Deliberately off the seeded stream: generate() reseeds immediately
      // after this, so a seeded draw would restart from the same state and
      // hand back the same front forever. The transition isn't part of the
      // composition anyway — it's how you got there, not what you got.
      const choice = wipeInput.value;
      const name = choice === 'random'
        ? WIPE_NAMES[Math.floor(Math.random() * WIPE_NAMES.length)]
        : choice;

      wipe = {
        t: 0,
        step: 0,
        at: ARRIVALS[name] || ARRIVALS.diagonal,
        bg: viewBg.slice(),
        fill: viewFill.slice(),
        char: viewChar.slice(),
        fg: viewFg.slice()
      };
      generate();
    }

    /* ---------------------------------------------------------------
       Permalink. Everything that decides what you are looking at — the
       seed and every control — round-trips through the URL hash, so a
       composition you like can be kept or handed to someone else. The
       one thing that can't ride along is a dropped picture: it stays
       local to the tab.

       Defaults are omitted, so a bare share of an untouched canvas is
       just `#seed=…` rather than a wall of parameters.
    --------------------------------------------------------------- */
    const URL_FIELDS = {
      palette: paletteInput, size: cellSizeInput, speed: speedInput,
      density: densityInput, scale: scaleInput, drift: driftInput,
      ground: groundInput, renew: renewInput,
      chroma: chromaInput,
      split: splitInput, decay: decayInput, trail: trailInput,
      wipe: wipeInput, msgsplit: msgSplitInput, glow: glowInput,
      screen: screenInput,
      motion: motionInput, fmt: msgFormat, msg: msgText
    };

    // Captured before any URL is applied, so "default" means the markup's
    // value rather than whatever the last link happened to set.
    const URL_DEFAULTS = Object.fromEntries(
      Object.entries(URL_FIELDS).map(([k, el]) => [k, el.value]));

    // The last hash this page wrote, so the hashchange listener can tell
    // an edit in the address bar from its own echo.
    let lastHash = null;

    function writeUrl() {
      const p = new URLSearchParams();
      p.set('seed', String(seed));
      for (const [k, el] of Object.entries(URL_FIELDS)) {
        if (el.value !== URL_DEFAULTS[k]) p.set(k, el.value);
      }
      const hash = '#' + p.toString();
      lastHash = hash;
      try {
        history.replaceState(null, '', hash);
      } catch {
        // A page opened straight off disk has an opaque origin, and
        // replaceState refuses to write a URL into one. Assigning the hash
        // still works; it just leaves history entries behind.
        if (location.hash !== hash) location.hash = hash;
      }
    }

    function readUrl() {
      const p = new URLSearchParams(location.hash.slice(1));
      const s = parseInt(p.get('seed'), 10);
      if (Number.isFinite(s)) seed = s >>> 0;

      for (const [k, el] of Object.entries(URL_FIELDS)) {
        const v = p.get(k);
        // Absent means default rather than "leave alone": the hash is the
        // whole description of the state, so a parameter someone deleted
        // has to reset the control instead of lingering on the old value.
        const next = v === null ? URL_DEFAULTS[k] : v;
        // A select handed an unknown value goes to selectedIndex -1, which
        // would break the custom dropdown that reads from it. Ignore those.
        if (el.tagName === 'SELECT' &&
            ![...el.options].some((o) => o.value === next)) continue;
        el.value = next;
      }
    }

    // Slider drags fire continuously, so coalesce rather than rewriting
    // the address bar on every pixel of travel.
    let urlTimeout;
    const writeUrlSoon = () => {
      clearTimeout(urlTimeout);
      urlTimeout = setTimeout(writeUrl, 250);
    };

    readUrl();
    applyPalette(paletteInput.value);
    generate();
    sizeVal.textContent = cellSizeInput.value;
    writeUrl();

    // A link carrying text reveals it on arrival rather than dropping it
    // in settled, so opening a share plays the animation it was made for.
    if (msgText.value) layoutMessage(msgText.value, false);

    // Any control that moves is part of what a link describes. Both events
    // bubble, so one pair of listeners covers the whole panel.
    panel.addEventListener('input', writeUrlSoon);
    panel.addEventListener('change', writeUrlSoon);

    // Build the panel block on load rather than snapping it in, so the
    // first thing you see is the same effect the toggle plays.
    panelAnim = { t: 0, step: 0, dir: 1 };

    paletteInput.addEventListener('change', () => {
      wipe = null;
      applyPalette(paletteInput.value);
      generate();   // colours are baked into base and entities at build time
    });

    // Changing the cell size reshapes the grid, so both of these need a
    // full rebuild — debounced, since dragging a slider fires constantly.
    let rebuildTimeout;
    const rebuildSoon = (delay) => {
      clearTimeout(rebuildTimeout);
      rebuildTimeout = setTimeout(() => { wipe = null; generate(); }, delay);
    };

    window.addEventListener('resize', () => rebuildSoon(150));

    cellSizeInput.addEventListener('input', () => {
      sizeVal.textContent = cellSizeInput.value;
      rebuildSoon(120);
    });

    const syncDecay = () => {
      decayVal.textContent = decaySeconds() === 0 ? 'off' : decaySeconds() + 's';
    };
    decayInput.addEventListener('input', syncDecay);
    syncDecay();

    const syncDensity = () => { densityVal.textContent = densityInput.value; };
    densityInput.addEventListener('input', syncDensity);
    syncDensity();   // keeps the readout honest if the default ever changes

    const syncScale = () => { scaleVal.textContent = sizeScale().toFixed(1) + '×'; };
    scaleInput.addEventListener('input', syncScale);
    syncScale();

    const syncDrift = () => {
      driftVal.textContent = driftInput.value === '0' ? 'off' : driftInput.value + '%';
      // Nothing advances the variables once the rate is zero, so park them.
      if (!driftRate()) {
        grid.style.setProperty('--driftX', '0px');
        grid.style.setProperty('--driftY', '0px');
      }
    };
    driftInput.addEventListener('input', syncDrift);
    syncDrift();

    const syncGround = () => {
      groundVal.textContent = groundInput.value === '0' ? 'bare' : groundInput.value + '%';
    };
    groundInput.addEventListener('input', syncGround);
    syncGround();

    const syncRenew = () => {
      renewVal.textContent = renewInput.value === '0' ? 'off' : renewInput.value + '%';
    };
    renewInput.addEventListener('input', syncRenew);
    syncRenew();

    const syncChroma = () => {
      chromaVal.textContent = chromaInput.value === '0' ? 'off' : chromaInput.value + '%';
      // Entries are keyed by colour and column only, so a new amount
      // would otherwise keep serving shifts computed at the old one.
      chromaCache.clear();
      composite();
    };
    chromaInput.addEventListener('input', syncChroma);
    syncChroma();

    const syncSplit = () => {
      splitVal.textContent = splitInput.value === '0' ? 'off' : splitInput.value + 'c';
      composite();
    };
    splitInput.addEventListener('input', syncSplit);
    syncSplit();

    // Nothing to recompute — the flag is read straight out of the second
    // pass — so it only needs the frame drawn again.
    msgSplitInput.addEventListener('change', composite);

    // Purely presentational — one class on the container, nothing to
    // recompute and no frame to redraw.
    glowInput.addEventListener('change', syncGlow);

    // A live source re-screens itself on the next step anyway; a still
    // needs telling.
    screenInput.addEventListener('change', () => {
      if (photo) { buildPhotoField(); composite(); }
    });

    /* ---------------------------------------------------------------
       The hash is read on every change, not only at load: edit it in the
       address bar — swap the message, bump the seed, change the palette —
       and the canvas follows. That makes a link a live description of the
       state rather than a one-shot import, and it is what lets someone
       hand-modify a shared URL instead of hunting for the control.
    --------------------------------------------------------------- */
    function applyUrlState() {
      const was = { seed };
      for (const k in URL_FIELDS) was[k] = URL_FIELDS[k].value;

      readUrl();
      const changed = (k) => URL_FIELDS[k].value !== was[k];

      // Custom dropdowns hold their own label; the readouts likewise.
      for (const el of Object.values(URL_FIELDS)) if (el.syncUi) el.syncUi();
      // A link describes the controls directly, so no preset name applies.
      presetInput.value = 'custom';
      if (presetInput.syncUi) presetInput.syncUi();
      sizeVal.textContent = cellSizeInput.value;
      syncDrift();
      syncGround();
      syncRenew();
      syncDecay();
      syncDensity();
      syncScale();

      if (changed('palette')) applyPalette(paletteInput.value);
      syncGlow();   // depends on the palette as well as the control

      // Seed, palette and cell size are all baked into the base layer at
      // build time, so any of them means laying the poster again. The rest
      // are read live by the ticker and need no rebuild.
      if (seed !== was.seed || changed('palette') || changed('size')) {
        wipe = null;
        generate();
      }

      // Replay rather than drop it in settled: an edited link should show
      // the reveal, the same as arriving on one.
      if (changed('msg') || changed('fmt')) layoutMessage(msgText.value, false);

      // Both end in a composite, which also flushes any re-laid message.
      syncChroma();
      syncSplit();
    }

    window.addEventListener('hashchange', () => {
      // Our own writes come back through here on the location.hash
      // fallback path, and re-applying them would fight the controls.
      if (location.hash === lastHash) return;
      applyUrlState();
    });

    /* ---------------------------------------------------------------
       Presets: a set of control values applied at once, with no state of
       their own. That is why they don't ride in the URL — what they set
       already does, and a stored name would only go stale the first time
       someone nudged a slider.
    --------------------------------------------------------------- */
    const PRESETS = {
      poster:     { size: 26, speed: 100, density: 7,  scale: 100, chroma: 0,  split: 0, decay: 3 },
      // Split stays off here: at this density every cell already borders
      // a different colour, so fringing them all is noise rather than
      // effect. Aberration is the preset that owns that.
      storm:      { size: 20, speed: 165, density: 18, scale: 80,  chroma: 0,  split: 0, decay: 1.5 },
      minimal:    { size: 34, speed: 55,  density: 3,  scale: 160, chroma: 0,  split: 0, decay: 5 },
      aberration: { size: 26, speed: 85,  density: 9,  scale: 120, chroma: 70, split: 3, decay: 3 }
    };

    // Only the controls a preset actually sets; a preset shouldn't be
    // invalidated by typing a message or picking a brush.
    const PRESET_CONTROLS = new Set(
      ['size', 'speed', 'density', 'scale', 'chroma', 'split', 'decay']
        .map((k) => URL_FIELDS[k]));

    presetInput.addEventListener('change', () => {
      const p = PRESETS[presetInput.value];
      if (!p) return;

      for (const [k, v] of Object.entries(p)) URL_FIELDS[k].value = v;
      sizeVal.textContent = cellSizeInput.value;
      syncDrift();
      syncGround();
      syncRenew();
      syncDecay();
      syncDensity();
      syncScale();
      syncChroma();
      syncSplit();

      // Cell size is in there, which reshapes the grid — and arriving
      // through the sweep suits a wholesale change better than a cut.
      startRegenerate();
      writeUrl();
    });

    // Moving one of those controls by hand means the shown preset no
    // longer describes what you are looking at, so stop claiming it does.
    const dropPreset = (e) => {
      if (presetInput.value === 'custom' || !PRESET_CONTROLS.has(e.target)) return;
      presetInput.value = 'custom';
      if (presetInput.syncUi) presetInput.syncUi();
    };
    panel.addEventListener('input', dropPreset);
    panel.addEventListener('change', dropPreset);

    // Regenerate is now literally "roll a new number". Everything else
    // that rebuilds — resize, cell size, palette — deliberately keeps the
    // seed, so those are the same composition seen differently.
    document.getElementById('regen').addEventListener('click', () => {
      seed = (Math.random() * 0x100000000) >>> 0;
      startRegenerate();
      writeUrl();
    });

    /* ---------------------------------------------------------------
       Sources. A still is decoded once and re-screened whenever the grid
       changes; a clip or a camera is the same picture path re-read on
       every step, which is all "live" means here. Each arrives through
       the regenerate sweep rather than a cut, so the halftone is laid
       down by the same diagonal front everything else uses.
    --------------------------------------------------------------- */
    const imgBtn = document.getElementById('imgBtn');
    const imgFile = document.getElementById('imgFile');
    const camBtn = document.getElementById('camBtn');

    let camStream = null;     // held so its tracks can be stopped again

    const sourceGroup = document.getElementById('sourceGroup');
    const motionRow = document.getElementById('motionRow');

    const syncImage = () => {
      imgBtn.textContent = photoSrc && !camStream ? 'Clear Source' : 'Load Media';
      camBtn.textContent = camStream ? 'Stop Camera' : 'Camera';
      // Screen governs how any source is drawn, so it comes with the first
      // one. Motion has nothing to difference against on a still, so it
      // waits for a source that moves — a clip or the camera.
      sourceGroup.hidden = !photoSrc;
      motionRow.hidden = !photoLive;
    };

    // Drops every source, whichever kind, and releases the camera with it.
    function clearSource() {
      if (camStream) {
        camStream.getTracks().forEach((t) => t.stop());
        camStream = null;
      }
      if (photoSrc && photoSrc.srcObject) photoSrc.srcObject = null;
      if (photoSrc && photoSrc.dataset && photoSrc.dataset.objectUrl) {
        URL.revokeObjectURL(photoSrc.dataset.objectUrl);
      }
      photoSrc = null;
      photo = null;
      photoLive = false;
      photoMirror = false;
      photoSamples = 0;
      motionHot.length = 0;
    }

    function useSource(src, { live, mirror }) {
      clearSourceKeepingStream();
      photoSrc = src;
      photoLive = live;
      photoMirror = mirror;
      startRegenerate();
      syncImage();
    }

    // Swapping one source for another must not tear down a camera that is
    // the source being installed.
    function clearSourceKeepingStream() {
      photo = null;
      photoLive = false;
      photoMirror = false;
      photoSamples = 0;
      motionHot.length = 0;
    }

    function loadMediaFile(file) {
      if (!file) return;
      const isVideo = file.type.startsWith('video/');
      if (!isVideo && !file.type.startsWith('image/')) return;

      const url = URL.createObjectURL(file);

      if (isVideo) {
        const v = document.createElement('video');
        v.dataset.objectUrl = url;
        v.muted = true;          // autoplay is refused otherwise
        v.loop = true;
        v.playsInline = true;
        v.onloadeddata = () => {
          clearSource();
          v.play().catch(() => {});
          useSource(v, { live: true, mirror: false });
        };
        v.onerror = () => URL.revokeObjectURL(url);
        v.src = url;
        return;
      }

      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        clearSource();
        useSource(img, { live: false, mirror: false });
      };
      img.onerror = () => URL.revokeObjectURL(url);
      img.src = url;
    }

    /* The camera is just a <video> that never ends. getUserMedia needs a
       secure context, which localhost counts as but a page opened straight
       off disk does not — hence `npm start` if this refuses. */
    let camNotice;

    async function startCamera() {
      const fail = (msg) => {
        camBtn.textContent = msg;
        clearTimeout(camNotice);
        camNotice = setTimeout(syncImage, 2200);
      };

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return fail('No Camera API');
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
      } catch (err) {
        const name = err && err.name;
        return fail(name === 'NotAllowedError' ? 'Camera Denied'
                  : name === 'NotFoundError' ? 'No Camera'
                  : 'Camera Failed');
      }

      clearSource();
      camStream = stream;

      const v = document.createElement('video');
      v.srcObject = stream;
      v.muted = true;
      v.playsInline = true;

      // Install first and start playing after, rather than awaiting play():
      // sampling already tolerates a source that has no frame yet and
      // re-reads every step, so there is nothing to wait for — and a play()
      // that never settles would otherwise strand the camera silently.
      useSource(v, { live: true, mirror: true });
      v.play().catch(() => {});
    }

    camBtn.addEventListener('click', () => {
      if (camStream) {
        clearSource();
        startRegenerate();
        syncImage();
      } else {
        startCamera();
      }
    });

    imgBtn.addEventListener('click', () => {
      if (photoSrc && !camStream) {
        clearSource();
        startRegenerate();
        syncImage();
      } else {
        imgFile.click();
      }
    });

    imgFile.addEventListener('change', () => {
      loadMediaFile(imgFile.files[0]);
      imgFile.value = '';   // so the same file can be picked again
    });

    // Drop anywhere. dragleave fires when crossing between cells too, so
    // the frame is cleared on the window boundary rather than per element.
    const setDropping = (on) => document.body.classList.toggle('dropping', on);

    window.addEventListener('dragover', (e) => { e.preventDefault(); setDropping(true); });
    window.addEventListener('dragleave', (e) => { if (!e.relatedTarget) setDropping(false); });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      setDropping(false);
      loadMediaFile(e.dataTransfer.files[0]);
    });

    syncImage();

    /* --- Share --------------------------------------------------- */

    const shareBtn = document.getElementById('share');

    // execCommand is deprecated but still the only path when the async
    // clipboard is refused — which happens for a page opened straight off
    // disk, and this is a single file meant to be opened that way. The
    // fallback runs on rejection as well as absence: the API being
    // present is no promise that it will let you write.
    function legacyCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok ? Promise.resolve() : Promise.reject(new Error('copy refused'));
    }

    function copyText(text) {
      if (!navigator.clipboard) return legacyCopy(text);
      return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
    }

    let shareTimeout;
    shareBtn.addEventListener('click', () => {
      writeUrl();   // flush any drag still sitting in the debounce
      copyText(location.href)
        .then(() => { shareBtn.textContent = 'Copied!'; })
        .catch(() => { shareBtn.textContent = 'Copy failed'; })
        .finally(() => {
          clearTimeout(shareTimeout);
          shareTimeout = setTimeout(() => { shareBtn.textContent = 'Share Link'; }, 1400);
        });
    });

    /* ---------------------------------------------------------------
       Ticker. Runs at a fixed step rather than per-frame: the grid is
       chunky, and stepping it mechanically suits the poster better than
       smooth interpolation.
    --------------------------------------------------------------- */
    const animBtn = document.getElementById('anim');
    const STEP = 1 / 18;
    let animating = true;
    let lastTs = 0, accumulator = 0;

    function tick(ts) {
      requestAnimationFrame(tick);

      const raw = lastTs ? (ts - lastTs) / 1000 : 0;
      lastTs = ts;
      // Ceiling so a backgrounded tab doesn't fast-forward on return;
      // floor because a timestamp that ever went backwards would drive
      // the whole artwork in reverse rather than simply stalling it.
      const dt = Math.max(0, Math.min(0.25, raw));

      let stepped = false;
      if (animating) {
        const scale = speedInput.value / 100;
        accumulator += dt * scale;
        clock += dt * scale;

        // Ease the ground toward wherever the slider is.
        const gTarget = groundTarget();
        if (groundLevel !== gTarget) {
          groundLevel += (gTarget - groundLevel) * Math.min(1, dt * scale * GROUND_EASE);
          if (Math.abs(gTarget - groundLevel) < 0.002) groundLevel = gTarget;
          stepped = true;
        }

        // One property on the container moves every halftone field at once.
        const drift = driftRate();
        if (drift) {
          const d = clock * drift;
          grid.style.setProperty('--driftX', ((d * 0.80) % DRIFT_WRAP).toFixed(1) + 'px');
          grid.style.setProperty('--driftY', ((d * 0.45) % DRIFT_WRAP).toFixed(1) + 'px');
        }

        while (accumulator >= STEP) {
          accumulator -= STEP;
          entities = entities.filter((e) => updateEntity(e, STEP));
          topUpEntities();
          stepRenew(STEP);
          stepped = true;
        }

        // A camera or a clip is re-screened on the artwork's own step
        // rather than per frame: the grid only redraws at STEP anyway, so
        // sampling faster would be work nobody sees. Pause freezes the
        // feed with everything else, which is what makes it possible to
        // hold a frame you like.
        if (photoLive && stepped) {
          samplePhoto();
          if (photo) {
            if (motionDrives()) measureMotion();
            buildPhotoField();
          }
        }

        // Hand expired painted cells back to the composition. Tied to the
        // artwork clock rather than wall time, so pausing holds a drawing
        // in place instead of eating it while you look at it.
        const life = decaySeconds();
        if (life > 0) {
          for (const [i, rec] of painted) {
            if (clock - rec.at >= life + rec.jit * PAINT_SPREAD) {
              Object.assign(base[i], rec.prev);
              painted.delete(i);
              stepped = true;
            }
          }
        }
      }

      // The sweep runs on real time, off the speed slider and outside the
      // pause: it is a UI transition, not part of the artwork's motion, and
      // scaling it would let Pause or speed 0 strand it half way across.
      if (wipe) {
        wipe.t += dt;
        wipe.step = Math.floor(wipe.t * 12);
        if (wipe.t > WIPE_SWEEP + WIPE_HOLD) wipe = null;
        stepped = true;
      }

      // Message reveal, also real time — it is a response to a button
      // press. Once revealed it only keeps ticking if decay is armed, so
      // a permanent message costs no frames; arming the slider later
      // simply resumes the clock and the word starts to fray.
      if (message) {
        const life = decaySeconds();
        if (life > 0 && message.t > message.endAt + life + MSG_FADE_SPREAD) {
          // Rewind rather than clear: once it has decayed away the whole
          // reveal plays again. Decay 0 holds it instead, and an empty
          // input is still what removes it for good.
          message.t = 0;
          message.step = 0;
          stepped = true;
        } else if (message.t < message.endAt || life > 0) {
          message.t += dt;
          message.step = Math.floor(message.t * MSG_CHURN);
          stepped = true;
        }
      }

      // Panel build/clear, likewise on real time.
      if (panelAnim) {
        panelAnim.t += dt;
        panelAnim.step = Math.floor(panelAnim.t * 12);
        if (panelAnim.t > PANEL_SWEEP + PANEL_TRAIL) {
          const built = panelAnim.dir > 0;
          panelAnim = null;
          panelOpen = built;
          syncPanelGeometry();
          // Controls only arrive once the block beneath them is complete.
          if (built) panel.classList.add('visible');
        }
        stepped = true;
      }

      if (stepped) composite();
    }
    requestAnimationFrame(tick);

    animBtn.addEventListener('click', () => {
      animating = !animating;
      animBtn.textContent = animating ? 'Pause' : 'Play';
    });

    /* Swaps a native <select> for a styleable stand-in. The original is
       kept in the DOM as the source of truth — hidden, not removed — so
       `.value` reads and `change` listeners elsewhere keep working. */
    function enhanceSelect(sel) {
      const wrap = document.createElement('div');
      wrap.className = 'sel';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sel-btn';
      btn.setAttribute('aria-haspopup', 'listbox');
      btn.setAttribute('aria-expanded', 'false');

      const label = document.createElement('span');
      const caret = document.createElement('span');
      caret.className = 'sel-caret';
      caret.textContent = '▼';
      btn.append(label, caret);

      const list = document.createElement('div');
      list.className = 'sel-list';
      list.setAttribute('role', 'listbox');

      const close = () => {
        wrap.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      };

      const sync = () => {
        label.textContent = sel.options[sel.selectedIndex].textContent;
        [...list.children].forEach((row, i) =>
          row.classList.toggle('selected', i === sel.selectedIndex));
      };

      [...sel.options].forEach((opt) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'sel-option';
        row.setAttribute('role', 'option');
        row.textContent = opt.textContent;
        row.addEventListener('click', () => {
          sel.value = opt.value;
          // Re-dispatch so the existing palette / fill handlers still fire.
          sel.dispatchEvent(new Event('change', { bubbles: true }));
          close();
        });
        list.appendChild(row);
      });

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = wrap.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(open));
      });
      document.addEventListener('click', close);

      sel.parentNode.insertBefore(wrap, sel);
      wrap.append(btn, list);
      sel.classList.add('sr-only');
      sel.addEventListener('change', sync);
      // Exposed so state pushed in from outside — a hash edit — can
      // refresh the visible label without dispatching a `change` and
      // setting off every handler listening for a real user choice.
      sel.syncUi = sync;
      sync();
    }

    enhanceSelect(paletteInput);
    enhanceSelect(fillModeInput);
    enhanceSelect(presetInput);
    enhanceSelect(brushInput);
    enhanceSelect(trailInput);
    enhanceSelect(wipeInput);
    enhanceSelect(msgSplitInput);
    enhanceSelect(glowInput);
    enhanceSelect(screenInput);
    enhanceSelect(motionInput);
    enhanceSelect(msgFormat);

    // The typed glyph is meaningless while a shape brush is selected, so
    // dim it rather than leaving a control that silently does nothing.
    const syncBrush = () => {
      const shape = !!brushInput.value;
      cellCharInput.disabled = shape;
      cellCharInput.style.opacity = shape ? 0.4 : 1;
    };
    brushInput.addEventListener('change', syncBrush);
    syncBrush();

    /* --- Message ------------------------------------------------- */

    // Reuse the drawn arrow rather than a glyph, so the button carries the
    // same mark the brush does. It strokes in currentColor and so themes.
    msgGo.innerHTML = ARROW_SVG.get('svg:90');

    const revealMessage = () => {
      layoutMessage(msgText.value, false);   // empty input clears it
      composite();
    };

    msgGo.addEventListener('click', revealMessage);
    msgText.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') revealMessage();
    });

    panelToggle.addEventListener('click', () => {
      if (panelAnim) return;   // ignore clicks mid-sweep
      if (panelOpen) {
        // Controls go first, so they aren't left floating over bare canvas
        // while the block underneath is being lifted.
        panel.classList.remove('visible');
        panelAnim = { t: 0, step: 0, dir: -1 };
      } else {
        panelAnim = { t: 0, step: 0, dir: 1 };
        panelOpen = true;      // cells start being laid immediately
      }
      syncPanelGeometry();
    });

    /* --- Painting ------------------------------------------------ */
    // Paints into the base layer, so edits survive entities passing over.

    // Mix toward a target rather than scaling toward black, so the trail
    // can sink either way. A blend and not an alpha: the cell stays
    // opaque, so the composition behind never shows through a stroke.
    function blend(hex, target, amount) {
      if (!amount || !hex || hex.charCodeAt(0) !== 35) return hex;
      const a = parseInt(hex.slice(1, 7), 16);
      const b = parseInt(target.slice(1, 7), 16);
      const mix = (sh) => {
        const from = (a >> sh) & 255;
        return clamp255(from + (((b >> sh) & 255) - from) * amount);
      };
      return '#' + hex2(mix(16)) + hex2(mix(8)) + hex2(mix(0)) + hex.slice(7);
    }

    // Where a fading cell is headed. Auto sinks it into the palette's own
    // ground, which is what makes it recede on a dark canvas and on a pale
    // one alike; the other two force the direction regardless of palette.
    function trailTarget() {
      const mode = trailInput.value;
      return mode === 'dark' ? '#000000' : mode === 'light' ? '#ffffff' : C.paper;
    }

    // How far down the ramp a cell that many places behind the head sits.
    function strokeLevel(depth) {
      // The trail only makes sense as a preview of the decay that follows
      // it. With Decay off nothing ever hands these cells back, so a faded
      // tail would be a permanently half-erased stroke — on a pale palette
      // it drops to about 1.4:1 against the ground and reads as gone. Keep
      // the whole drag at full strength instead.
      if (decaySeconds() === 0) return 0;
      if (depth < STROKE_TAIL) return 0;
      return Math.round(clamp01((depth - STROKE_TAIL) / STROKE_SPAN) * STROKE_STEPS);
    }

    /* Re-shades the tail after each new cell. Walks oldest to newest so a
       drag that crosses its own path leaves the cell at its newest depth,
       and only touches the window that can still be changing level —
       anything further back reached the deepest shade already. */
    function shadeStroke() {
      const start = Math.max(0, stroke.length - (STROKE_TAIL + STROKE_SPAN + 1));
      const to = trailTarget();

      for (let k = start; k < stroke.length; k++) {
        const i = stroke[k];
        const rec = painted.get(i);
        if (!rec) continue;             // decayed back out from under us

        const lvl = strokeLevel(stroke.length - 1 - k);
        if (rec.lvl === lvl) continue;  // nothing to redraw for this one
        rec.lvl = lvl;

        const amount = (lvl / STROKE_STEPS) * STROKE_FADE;
        const bg = blend(rec.bg, to, amount);
        const fg = blend(rec.fg, to, amount);
        const m = base[i];
        m.bg = bg;
        m.fg = fg;
        // The fill bakes its colour into a data-URI, so a shaded cell
        // needs its pattern rebuilt rather than recoloured.
        m.fill = rec.mode === 'dots'  ? dotFill(fg, 6, 1)
               : rec.mode === 'hatch' ? hatchFill(fg, 8, 3)
               : null;
      }
    }

    function paintFromInputs(el) {
      const i = els.indexOf(el);
      if (i < 0) return;
      const fg = textColorInput.value;
      const mode = fillModeInput.value;

      const m = base[i];

      // Snapshot the untouched cell the first time it is painted — never
      // on a repaint, or the "original" would become an earlier brush
      // stroke and the cell could never find its way back.
      const rec = painted.get(i);
      const prev = rec ? rec.prev : { bg: m.bg, fill: m.fill, char: m.char, fg: m.fg };
      const x = i % cols, y = (i / cols) | 0;
      // Stored as a stamp plus a jitter rather than a deadline, so moving
      // the Decay slider retimes strokes that are already on the canvas.
      // bg/fg/mode are the colours as picked; shadeStroke derives the
      // dimmed ones from these so re-shading never compounds.
      painted.set(i, {
        prev, at: clock, jit: fbm(x * 0.25, y * 0.25, 11),
        bg: bgColorInput.value, fg, mode, lvl: -1
      });

      m.bg = bgColorInput.value;
      m.fg = fg;
      // A shape brush paints a drawn token; otherwise the typed glyph,
      // sliced in case a paste got past the maxlength.
      m.char = brushInput.value || cellCharInput.value.slice(0, 1);
      m.fill = mode === 'dots'  ? dotFill(fg, 6, 1)
             : mode === 'hatch' ? hatchFill(fg, 8, 3)
             : null;
      if (suppressesChar(m.fill)) m.char = '';

      stroke.push(i);
      shadeStroke();
      composite();
    }

    let painting = false;
    grid.addEventListener('mousedown', (e) => {
      if (!e.target.classList.contains('cell')) return;
      painting = true;
      stroke = [];   // each drag trails on its own, not on the last one
      paintFromInputs(e.target);
      e.preventDefault();
    });
    grid.addEventListener('mouseover', (e) => {
      if (painting && e.target.classList.contains('cell')) paintFromInputs(e.target);
    });
    // The shading stays where the drag left it; the Decay clock is what
    // eventually hands these cells back to the composition.
    window.addEventListener('mouseup', () => { painting = false; stroke = []; });
  </script>
</body>
</html>
